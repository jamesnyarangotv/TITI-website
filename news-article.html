<script>

/* ==========================================
   TITI ARTICLE SYSTEM
   IMPROVED SUPABASE LOADING
   IMAGE DISPLAY AND ERROR HANDLING
   ========================================== */

const SUPABASE_URL = "https://jlmbiauilmajuvrnuaul.supabase.co";
const SUPABASE_KEY = "sb_publishable_b3g7gWtSGVtI5lCyCR5LxA_KjFXh08W";

const articleArea = document.getElementById("articleArea");

document.getElementById("footer-year").textContent =
    new Date().getFullYear();

/* CHECK SUPABASE */

if (!window.supabase) {
    showError("Unable to connect to the article service.");
} else {

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: false,
                autoRefreshToken: false
            }
        }
    );

    loadArticle();

}

/* HTML SECURITY */

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);

}

/* ARTICLE DATE */

function formatDate(dateValue) {

    if (!dateValue) return "Recently published";

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "Recently published";
    }

    return date.toLocaleDateString("en-UG", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

}

/* ERROR DISPLAY */

function showError(message) {

    articleArea.innerHTML = `
        <div class="state-message">
            <h2>${escapeHTML(message)}</h2>
            <p>
                We could not retrieve this article.
                Please try again.
            </p>
            <a href="news.html">RETURN TO NEWS &amp; UPDATES</a>
        </div>
    `;

}

/* ARTICLE CONTENT */

function formatArticleContent(value) {

    if (!value) {
        return "<p>The full story will be updated soon.</p>";
    }

    return String(value)
        .trim()
        .split(/\n\s*\n/)
        .filter(paragraph => paragraph.trim())
        .map(paragraph => `
            <p>${escapeHTML(paragraph).replace(/\n/g, "<br>")}</p>
        `)
        .join("");

}

/* DISPLAY ARTICLE */

function displayArticle(article) {

    if (!article || !article.title) {
        showError("Article information is incomplete");
        return;
    }

    document.title =
        `${article.title} | Tahidi International Training Institute`;

    const summary = escapeHTML(article.summary || "");

    const imageURL = article.image_url || "";

    let imageHTML = "";

    if (
        imageURL &&
        /^https:\/\//i.test(imageURL)
    ) {

        imageHTML = `
            <div class="article-image-wrap"
                 id="articleImageWrap">

                <img
                    class="article-image"
                    id="articleMainImage"
                    src="${escapeHTML(imageURL)}"
                    alt="${escapeHTML(article.title)}"
                    fetchpriority="high"
                    loading="eager"
                >

            </div>
        `;

    }

    const content = formatArticleContent(
        article.article_content
    );

    articleArea.innerHTML = `

        <div class="article-heading">

            <div class="article-category">
                ${escapeHTML(article.category || "NEWS")}
            </div>

            <h1 class="article-title">
                ${escapeHTML(article.title)}
            </h1>

            ${summary ? `
                <p class="article-summary">${summary}</p>
            ` : ""}

            <div class="article-meta">

                <span class="article-meta-item">
                    ${formatDate(
                        article.published_at || article.created_at
                    )}
                </span>

                ${article.author ? `
                    <span class="meta-dot"></span>
                    <span class="article-meta-item">
                        By ${escapeHTML(article.author)}
                    </span>
                ` : ""}

                <span class="meta-dot"></span>

                <span class="article-meta-item">
                    Tahidi International Training Institute
                </span>

            </div>

        </div>

        ${imageHTML}

        <div class="article-content">
            ${content}
        </div>

        <div class="article-end">

            <div class="article-end-label">
                TAHIDI INTERNATIONAL TRAINING INSTITUTE
            </div>

            <div class="article-buttons">

                <a href="news.html"
                   class="article-button back-button">
                    ← ALL NEWS
                </a>

                <button
                    type="button"
                    class="article-button share-button"
                    id="shareArticle">
                    SHARE ARTICLE
                </button>

            </div>

        </div>

    `;

    /* IMAGE ERROR HANDLING */

    const mainImage = document.getElementById("articleMainImage");

    if (mainImage) {

        mainImage.addEventListener("error", () => {

            const imageWrap =
                document.getElementById("articleImageWrap");

            if (imageWrap) {

                imageWrap.innerHTML = `
                    <div class="state-message">
                        <h2>Photograph unavailable</h2>
                        <p>Please check the published image address.</p>
                    </div>
                `;

            }

        });

    }

    /* SHARE ARTICLE */

    document.getElementById("shareArticle")
        .addEventListener("click", async () => {

            const shareData = {
                title: article.title,
                text: article.summary || article.title,
                url: window.location.href
            };

            try {

                if (navigator.share) {

                    await navigator.share(shareData);

                } else if (navigator.clipboard) {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert("TITI article link copied successfully.");

                } else {

                    alert(
                        "Copy the article link from your browser address bar."
                    );

                }

            } catch (error) {

                if (error.name !== "AbortError") {
                    console.error("TITI sharing error:", error);
                }

            }

        });

}

/* LOAD ARTICLE FROM SUPABASE */

async function loadArticle() {

    const params = new URLSearchParams(
        window.location.search
    );

    const articleId = params.get("id");

    if (!articleId) {
        showError("Article not found");
        return;
    }

    if (
        !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
        .test(articleId)
    ) {
        showError("Invalid article reference");
        return;
    }

    try {

        const request = db
            .from("titi_website_news")
            .select("*")
            .eq("id", articleId)
            .eq("is_published", true)
            .maybeSingle();

        /* PREVENT PERMANENT LOADING */

        const timeout = new Promise((_, reject) => {

            setTimeout(() => {
                reject(new Error("Article request timed out."));
            }, 15000);

        });

        const { data, error } = await Promise.race([
            request,
            timeout
        ]);

        if (error) {

            console.error("TITI SUPABASE ERROR:", error);

            showError("Unable to retrieve this article");

            return;

        }

        if (!data) {

            showError("Article not found or not published");

            return;

        }

        console.log("TITI ARTICLE SUCCESSFULLY LOADED:", data);

        displayArticle(data);

    } catch (error) {

        console.error("TITI ARTICLE SYSTEM ERROR:", error);

        showError(
            error.message === "Article request timed out."
                ? "Article loading timed out"
                : "A connection problem occurred"
        );

    }

}

/* ==========================================
   MOBILE NAVIGATION
   ========================================== */

const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");

menuToggle.addEventListener("click", () => {

    mainNav.classList.toggle("open");

    const isOpen = mainNav.classList.contains("open");

    menuToggle.setAttribute("aria-expanded", isOpen);

    menuToggle.setAttribute(
        "aria-label",
        isOpen ? "Close navigation" : "Open navigation"
    );

});

/* DROPDOWN MENUS */

const aboutMenu = document.getElementById("aboutMenu");
const aboutToggle = document.getElementById("aboutToggle");

const programmeMenu = document.getElementById("programmeMenu");
const programmeToggle = document.getElementById("programmeToggle");

const admissionsMenu = document.getElementById("admissionsMenu");
const admissionsToggle = document.getElementById("admissionsToggle");

const newsMenu = document.getElementById("newsMenu");
const newsToggle = document.getElementById("newsToggle");

aboutToggle.addEventListener("click", () => {

    aboutMenu.classList.toggle("open");

    aboutToggle.setAttribute(
        "aria-expanded",
        aboutMenu.classList.contains("open")
    );

});

programmeToggle.addEventListener("click", () => {

    programmeMenu.classList.toggle("open");

    programmeToggle.setAttribute(
        "aria-expanded",
        programmeMenu.classList.contains("open")
    );

});

admissionsToggle.addEventListener("click", () => {

    admissionsMenu.classList.toggle("open");

    admissionsToggle.setAttribute(
        "aria-expanded",
        admissionsMenu.classList.contains("open")
    );

});

newsToggle.addEventListener("click", () => {

    newsMenu.classList.toggle("open");

    newsToggle.setAttribute(
        "aria-expanded",
        newsMenu.classList.contains("open")
    );

});

/* CLOSE MENUS AFTER NAVIGATION */

document.querySelectorAll("#mainNav a").forEach(link => {

    link.addEventListener("click", () => {

        mainNav.classList.remove("open");

        programmeMenu.classList.remove("open");
        admissionsMenu.classList.remove("open");
        aboutMenu.classList.remove("open");
        newsMenu.classList.remove("open");

        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Open navigation");

        programmeToggle.setAttribute("aria-expanded", "false");
        admissionsToggle.setAttribute("aria-expanded", "false");
        aboutToggle.setAttribute("aria-expanded", "false");
        newsToggle.setAttribute("aria-expanded", "false");

    });

});

/* CLOSE DROPDOWNS WHEN CLICKING OUTSIDE */

document.addEventListener("click", event => {

    if (!programmeMenu.contains(event.target)) {
        programmeMenu.classList.remove("open");
        programmeToggle.setAttribute("aria-expanded", "false");
    }

    if (!admissionsMenu.contains(event.target)) {
        admissionsMenu.classList.remove("open");
        admissionsToggle.setAttribute("aria-expanded", "false");
    }

    if (!aboutMenu.contains(event.target)) {
        aboutMenu.classList.remove("open");
        aboutToggle.setAttribute("aria-expanded", "false");
    }

    if (!newsMenu.contains(event.target)) {
        newsMenu.classList.remove("open");
        newsToggle.setAttribute("aria-expanded", "false");
    }

});

</script>
